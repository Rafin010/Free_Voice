[General]
; Mode: "toggle" (press ` once to start Listening..., press again to stop) or "hold" (hold ` to speak)
Mode=toggle

; Language: "auto" for automatic detection, "en" for English, "bn" for Bengali
Language=auto

; Whisper model size: "tiny", "base", "small"
; "base" is recommended for balanced speed and accuracy on CPU
Model=base

; Play a subtle audio cue on start/stop listening (1 = yes, 0 = no)
SoundCue=1

; Local speech-to-text server port
Port=8765

; Auto-start the local Python STT server when FreeVoice.ahk launches (1 = yes, 0 = no)
AutoStartServer=1
